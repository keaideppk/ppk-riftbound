      <div id="caption" hidden><span id="caption-tag"></span><p id="caption-text"></p></div>
      <div id="room-banner" hidden><span></span><strong></strong></div>
    </div>
    <section id="boot" class="screen"><p class="eyebrow">RIFTBOUND</p><h2 id="boot-text">正在唤醒界门</h2><div class="progress"><i id="boot-progress"></i></div></section>
    <section id="title" class="screen" hidden aria-label="主菜单">
      <div class="title-shade"></div>
      <div class="title-content">
        <div class="wordmark"><span class="sigil" aria-hidden="true"></span><span>R I F T B O U N D</span></div>
        <h1>界隙行者</h1>
        <p class="premise">界门失联的第七夜，你收到了自己的求救信号。</p>
        <nav class="title-actions" aria-label="游戏菜单">
          <button id="begin" class="primary"><span>踏入界隙</span><span aria-hidden="true">→</span></button>
          <button id="continue" class="secondary" hidden>继续旅程</button>
          <button id="title-controls" class="text-button">操作与设置</button>
        </nav>
      </div>
      <div class="title-footer"><span>◈　界门站</span><button id="title-audio" class="text-button" aria-label="切换声音">声音开启</button></div>
    </section>
    <section id="panel" class="screen scrim" hidden aria-label="游戏菜单"><div id="panel-body" class="panel"></div></section>

  </div>
    <div id="touch" hidden aria-label="触屏操作">
      <div><button data-key="left" aria-label="左">◀</button><button data-key="right" aria-label="右">▶</button></div>

    </div>
</main>

}

// ====== Save data and settings ======
const SAVE_KEY='riftbound_save_v1', SETTINGS_KEY='riftbound_settings_v1';
const readStore = key => {
  try { return JSON.parse(localStorage.getItem(key)); } catch { return null; }
};
function writeStore(key,data) {
  try { localStorage.setItem(key,JSON.stringify(data)); return true; } catch { return false; }
}
const beacons=Object.keys(ROOMS).filter(id=>ROOMS[id].items.some(item=>item.kind==='beacon'));
const shardIds=Object.values(ROOMS).flatMap(room=>room.items.filter(i=>i.kind==='shard').map(i=>i.id));
const validatedSet=(list,valid)=>new Set(Array.isArray(list)?list.filter(id=>typeof id==='string'&&valid.includes(id)):[]);
function stateFrom(raw) {
  const state={
    abilities:validatedSet(raw?.abilities,Object.keys(ABILITIES)),
    defeated:validatedSet(raw?.defeated,Object.keys(BOSSES)),
    shards:validatedSet(raw?.shards,shardIds),
    visited:validatedSet(raw?.visited,mapOrder),
    beacons:validatedSet(raw?.beacons,beacons),
    weapons:validatedSet(raw?.weapons,weaponOrder),
    checkpoint:beacons.includes(raw?.checkpoint)?raw.checkpoint:'hub',
    deaths:clamp(Number.isFinite(raw?.deaths)?Math.trunc(raw.deaths):0,0,999999),
    elapsed:clamp(Number.isFinite(raw?.elapsed)?raw.elapsed:0,0,999999),
    seals:new Set()
  };
  for(const boss of state.defeated) if(BOSSES[boss].seal)state.seals.add(BOSSES[boss].seal);
  state.weapons.add('blade');
  // Saves from before weapon pickups had already completed these rooms.
  if(raw&&!Array.isArray(raw.weapons)){
    for(const id of weaponOrder)if(state.abilities.has(WEAPONS[id].ability))state.weapons.add(id);
  }
  state.weapon=state.weapons.has(raw?.weapon)?raw.weapon:'blade';
  state.beacons.add(state.checkpoint);state.beacons.add('hub');state.visited.add('hub');
  return state;
}
function settingsFrom(raw) {
  return { audio:raw?.audio!==false&&params.get('noaudio')!=='1',
    motion:typeof raw?.motion==='boolean'?raw.motion:matchMedia('(prefers-reduced-motion: reduce)').matches,
    touch:['auto','on','off'].includes(raw?.touch)?raw.touch:'auto', difficulty:raw?.difficulty==='story'?'story':'normal' };
}
const maxHealth = g => 5+g.state.shards.size;
const newPlayer = () => ({x:325,y:FLOOR,w:28,h:55,vx:0,vy:0,dir:1,grounded:true,health:5,energy:0,
  coyote:0,buffer:0,wallDir:0,wallLock:0,airJump:false,airDash:false,dashTime:0,dashCooldown:0,
  invulnerable:0,knock:0,attack:null,comboQueued:false,walkT:0});

// ====== Synthesized sound effects and ambience ======
function makeAudio(g){
  let ctx, bus, noise, next=0, seq=0;
  const tone=(f1,f2,length,vol,type='sine',delay=0)=>{
    if(!ctx||!g.settings.audio) return;
    const t=ctx.currentTime+delay,o=ctx.createOscillator(),v=ctx.createGain();
    o.type=type;o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(f2,t+length);
    v.gain.setValueAtTime(.0002,t);v.gain.exponentialRampToValueAtTime(vol,t+Math.min(.025,length*.2));
    v.gain.exponentialRampToValueAtTime(.0002,t+length);
    o.connect(v).connect(bus);o.start(t);o.stop(t+length+.02);
  };
  const sweep=(length,volume,from,to)=>{
    if(!ctx||!g.settings.audio) return;
    const t=ctx.currentTime,s=ctx.createBufferSource(),f=ctx.createBiquadFilter(),v=ctx.createGain();
    s.buffer=noise;f.type='bandpass';f.Q.value=.65;f.frequency.setValueAtTime(from,t);
    f.frequency.exponentialRampToValueAtTime(to,t+length);
    v.gain.setValueAtTime(.0002,t);v.gain.exponentialRampToValueAtTime(volume,t+.014);
    v.gain.exponentialRampToValueAtTime(.0002,t+length);
    s.connect(f).connect(v).connect(bus);s.start(t);s.stop(t+length);
  };
  const effects={
    jump:()=>tone(164,361,.15,.12,'triangle'),
    double:()=>{tone(270,465,.19,.12,'triangle');tone(442,786,.2,.07,'sine',.035);},
    dash:()=>{sweep(.22,.62,2200,370);tone(144,51,.21,.16,'triangle');},
    slash:()=>sweep(.19,.51,570,3400),
    spear:()=>{sweep(.18,.51,1280,5150);tone(342,189,.17,.11,'triangle');},
    hammer:()=>{sweep(.29,.48,754,235);tone(141,47,.30,.25,'triangle');},
    charge:()=>tone(290,425,.15,.09,'triangle'),
    bolt:()=>{sweep(.16,.37,2750,470);tone(932,246,.16,.12,'triangle');},
    equip:()=>tone(620,438,.09,.075,'triangle'),
    dry:()=>tone(166,116,.10,.085,'triangle'),
    hit:()=>{sweep(.15,.48,1800,308);tone(146,53,.17,.22,'triangle');tone(1327,1173,.19,.048);},
    hurt:()=>{sweep(.22,.40,540,183);tone(191,60,.25,.23,'sawtooth');},
    land:()=>sweep(.09,.14,690,99),
    heal:()=>[330,440,660].forEach((f,i)=>tone(f,f*1.015,.31,.17,'sine',i*.065)),
    collect:()=>[247,330,494,660].forEach((f,i)=>tone(f,f*1.022,.64,.18,'triangle',i*.105)),
    warn:()=>tone(146,174,.23,.13,'triangle'),
    door:()=>{tone(146,231,.42,.09);sweep(.26,.19,295,1800);}
  };
  return {
    unlock(){
      if(!g.settings.audio)return;
      try{
        if(!ctx){
          const AudioCtor=window.AudioContext||window.webkitAudioContext;
          if(!AudioCtor)return;
          ctx=new AudioCtor();bus=ctx.createGain();bus.gain.value=.27;bus.connect(ctx.destination);
          noise=ctx.createBuffer(1,ctx.sampleRate,ctx.sampleRate);
          const data=noise.getChannelData(0),r=rng(9247);
          for(let i=0;i<data.length;i++)data[i]=r()*2-1;
        }
        if(ctx.state==='suspended')ctx.resume().catch(()=>{});
      }catch{ctx=null;}
    },
    play(id){effects[id]?.();},
    volume(){if(ctx)bus.gain.setTargetAtTime(g.settings.audio?.27:0,ctx.currentTime,.035);},
    ambient(theme){
      if(!ctx||ctx.state!=='running'||!g.settings.audio||ctx.currentTime<next)return;
      const base={hub:110,iron:82.41,green:130.81,spore:98,rift:73.42}[theme];
      const ratios=[1,1.5,1.189,2,1.333,1.5,2.378,1.189];
      const underwater=theme==='spore'||theme==='rift';
      const f=base*ratios[seq%ratios.length];seq++;
      tone(f,f*(underwater?.994:1.003),2.25,.10,'sine');
      tone(base/2,base/2,3.4,.14);
      if(seq%3===0)tone(f*2,f*1.995,1.5,.05,'triangle',.27);
      next=ctx.currentTime+1.34;
    }
  };
}

// ====== AABB motion and input timing ======
function segmentEntry(x,y,dx,dy,b,pad=0){
  let first=0,last=1;
  for(const [origin,delta,min,max] of [[x,dx,b.x-pad,b.x+b.w+pad],[y,dy,b.y-pad,b.y+b.h+pad]]){
    if(Math.abs(delta)<.00001){if(origin<=min||origin>=max)return Infinity;continue;}
    const a=(min-origin)/delta,z=(max-origin)/delta;
    first=Math.max(first,Math.min(a,z));last=Math.min(last,Math.max(a,z));
    if(first>last)return Infinity;
  }
  return first;
}
function moveBody(body, dx, dy, room) {
  let wall=0, landed=false, ceiling=false;
  if(dx){
    body.x+=dx;
    for(const box of room.solids) if(overlaps(hitBox(body),box)){
      wall=Math.sign(dx);body.x=wall>0?box.x-body.w/2:box.x+box.w+body.w/2;
    }
  }
  if(dy){
    body.y+=dy;
    for(const box of room.solids) if(overlaps(hitBox(body),box)){
      if(dy>0){body.y=box.y;landed=true;}
      else {body.y=box.y+box.h+body.h;ceiling=true;}
    }
  }
  return {wall,landed,ceiling};
}
function wallSide(p,r,prefer){
  for(const sign of [prefer||1,-(prefer||1)]){
    const b=hitBox(p);b.x+=sign*3;b.y+=5;b.h-=10;
    if(r.solids.some(a=>overlaps(a,b)))return sign;
  }
  return 0;
}
function keepInside(e,r) {e.x=clamp(e.x,e.w*.5,r.w-e.w*.5);}
function walkEnemy(e,dx,dt,r){
  const ahead=e.x+Math.sign(dx)*(e.w*.54+Math.abs(dx));
  const probe={x:ahead-2,y:e.y+2,w:4,h:9};
  if(!e.grounded||r.solids.some(a=>overlaps(probe,a))) {
    if(moveBody(e,dx,0,r).wall)e.patrol*=-1;
  }else e.patrol*=-1;
  e.vy=Math.min(880,e.vy+1690*dt);
  const motion=moveBody(e,0,e.vy*dt,r);
  e.grounded=motion.landed;
  if(motion.landed||motion.ceiling)e.vy=0;
  keepInside(e,r);
}

// ====== Simulation, combat, and room transitions ======
class Game {
  constructor(){
    this.state=stateFrom(null);this.settings=settingsFrom(readStore(SETTINGS_KEY));
    this.saveData=readStore(SAVE_KEY);
    if(!this.saveData||!Array.isArray(this.saveData.visited))this.saveData=null;
    this.audio=makeAudio(this);this.random=rng(SEED^14647);this.mode='title';this.time=0;
    this.id='hub';this.player=newPlayer();this.camera=0;this.transition=0;this.stop=0;this.shake=0;
    this.enemies=[];this.projectiles=[];this.bolts=[];this.threats=[];this.particles=[];this.pool=[];
    this.keys=new Set();this.pressed=new Set();this.banner=0;this.caption=null;this.near=null;
    this.ready=false;
  }
  save(){
    const s=this.state;
    this.saveData={checkpoint:s.checkpoint,abilities:[...s.abilities],defeated:[...s.defeated],
      visited:[...s.visited],shards:[...s.shards],beacons:[...s.beacons],weapons:[...s.weapons],
      weapon:s.weapon,deaths:s.deaths,elapsed:s.elapsed};
    return writeStore(SAVE_KEY,this.saveData);
  }
  setMode(mode){
    this.mode=mode;this.keys.clear();this.pressed.clear();UI.mode(this);
  }
  start(resume=false){
    this.state=stateFrom(resume?this.saveData:null);
    this.player=newPlayer();this.player.health=maxHealth(this);
    this.caption=null;this.winTime=0;this.enterCheckpoint(this.state.checkpoint);
    this.setMode('play');this.save();
    if(!resume)this.say('检修员　07','界门重新上线。先去东侧钢铁矿区，找回失联的界印。',5.2);
    else if(this.state.defeated.has('mirror'))this.say('界门站','信号已恢复。你仍然可以探索剩下的房间。',4.5);
  }
  enterCheckpoint(id){
    const b=ROOMS[id].items.find(item=>item.kind==='beacon');
    this.enter(id,b.x,b.y);
  }
  enter(id,x,y){
    const r=ROOMS[id];
    this.id=id;this.room=r;this.near=null;this.entryX=x;this.entryY=y;this.state.visited.add(id);
    this.enemies=r.mobs.map(({type,x,y})=>{
      const d=ENEMIES[type];
      return {type,x,y,homeX:x,homeY:y,dir:-1,patrol:-1,w:d.w,h:d.h,hp:d.hp,flash:0,vy:0,
        grounded:!d.flying,mode:'idle',timer:.2+this.random()*.5};
    });
    if(r.boss&&!this.state.defeated.has(r.boss)){
      const data=BOSSES[r.boss], hp=this.settings.difficulty==='story'?Math.ceil(data.hp*.73):data.hp;
      this.enemies.push({boss:r.boss,x:640,y:FLOOR,w:70,h:91,hp,max:hp,dir:x>640?1:-1,patrol:1,vy:0,
        grounded:true,flash:0,mode:'idle',timer:.7,cycles:0,phase:0,active:false});
    }
    const p=this.player;
    Object.assign(p,{x,y,vx:0,vy:0,grounded:true,attack:null,comboQueued:false,coyote:.10,
      buffer:0,dashTime:0,dashCooldown:0,wallDir:0,wallLock:0,airJump:false,airDash:false,knock:0,walkT:0});
    p.dir=x>r.w*.74?-1:1;
    this.camera=clamp(x-W*.45,0,r.w-W);this.projectiles.length=0;this.bolts.length=0;this.threats.length=0;
    this.pool.push(...this.particles);this.particles.length=0;
    this.transition=.25;this.banner=2.05;this.stop=0;this.shake=0;artFor(id);
  }
  checkpoint(announce=true){
    const p=this.player;
    this.state.beacons.add(this.id);this.state.checkpoint=this.id;
    p.health=maxHealth(this);p.energy=Math.max(1,p.energy);
    const ok=this.save();
    if(announce)this.say('界标',ok?'生命已恢复。可打开地图传送至已点亮的界标。':'生命已恢复。浏览器存储不可用。',4.3);
    this.audio.play('heal');
  }
  travel(id){
    if(this.mode!=='map'||this.near?.kind!=='beacon'||!this.state.beacons.has(id)||id===this.id)return;
    this.enterCheckpoint(id);this.checkpoint(false);this.audio.play('door');this.setMode('play');
  }
  collected(item){
    if(item.kind==='ability')return this.state.abilities.has(item.id);
    if(item.kind==='weapon')return this.state.weapons.has(item.id);
    return item.kind==='shard'&&this.state.shards.has(item.id);
  }
  canPass(link){
    if(!link.need)return true;
    if(link.need==='seals')return this.state.seals.size===3;
    if(link.need==='boss')return this.state.defeated.has(this.room?.boss);
    return this.state.abilities.has(link.need)||this.state.seals.has(link.need);
  }
  lockText(link){
    if(link.need==='seals')return '需要三枚界印';
    if(link.need==='boss')return '需要击败此处的守卫';
    if(ABILITIES[link.need])return '需要'+ABILITIES[link.need].name;
    return '需要'+Object.values(BOSSES).find(b=>b.seal===link.need)?.title;
  }
  say(tag,text,duration=4.7){this.caption={tag,text,duration};}
  follow(link){
    this.enter(link.dest,link.spawn,link.spawnY);this.audio.play('door');this.save();
  }
  interaction(){
    const p=this.player;
    const items=this.room.items.filter(i=>!this.collected(i));
    const links=this.room.links.map(l=>({...l,kind:l.side?'edge':'portal'}));
    const nearby=[...items,...links].filter(i=>Math.abs(i.x-p.x)<(i.kind==='edge'?72:60)&&Math.abs(i.y-p.y)<49);
    if(!nearby.length) return null;
    return nearby.reduce((a,b)=>Math.hypot(a.x-p.x,a.y-p.y)<=Math.hypot(b.x-p.x,b.y-p.y)?a:b);
  }
  use(item){
    if(item.kind==='portal'||item.kind==='edge'){
      if(this.canPass(item)){this.follow(item);return true;}
      this.say('界门',this.lockText(item),2.4);return false;
    }
    if(item.kind==='beacon'){this.checkpoint();return false;}

      const p=this.player,target=clamp(p.x-W*.46+p.vx*.23,0,this.room.w-W);
      this.camera=lerp(this.camera,target,1-Math.exp(-dt*6.8));
    }
    this.pressed.clear();
  }
}


// ====== Atlas, overlays, and input ======
const el=id=>document.getElementById(id);
const stage=el('stage'), frame=el('frame'), view=el('view'), atlas=el('atlas');
const ctx=view.getContext('2d',{alpha:false});
const node=(tag,cls,value)=>{
  const n=document.createElement(tag);if(cls)n.className=cls;if(value)n.textContent=value;return n;
};
const activeTouch=()=>matchMedia('(pointer: coarse)').matches||
  (navigator.maxTouchPoints>0&&!matchMedia('(any-pointer: fine)').matches);
function resize(){
  const scale=Math.min(frame.clientWidth/W,frame.clientHeight/H);
  stage.style.setProperty('--scale',scale);
  frame.style.setProperty('--stage-pixel-width',W*scale+'px');
  frame.style.setProperty('--stage-pixel-height',H*scale+'px');
}
const text=(id,value)=>{const n=el(id);if(n.textContent!==value)n.textContent=value;};
const setContent=(n,value)=>{if(n.textContent!==value)n.textContent=value;};
const button=(label,cls,fn)=>{
  const b=node('button',cls,label);b.type='button';b.addEventListener('click',fn);return b;
};
function renderAtlas(g){
  const c=atlas.getContext('2d');c.fillStyle='#0c161a';c.fillRect(0,0,atlas.width,atlas.height);
  for(let x=12;x<atlas.width;x+=13)for(let y=11;y<atlas.height;y+=13){
    c.fillStyle='#26383c';c.fillRect(x,y,1,1);
  }
  const pos=id=>[390+ROOMS[id].map[0]*111,170+ROOMS[id].map[1]*62];
  const known=new Set(g.state.visited);
  for(const id of g.state.visited)for(const l of ROOMS[id].links)known.add(l.dest);
  const drawn=new Set();
  for(const id of known)for(const l of ROOMS[id].links){
    if(!known.has(l.dest)||l.need==='boss')continue;
    const key=[id,l.dest].sort().join(':');if(drawn.has(key))continue;drawn.add(key);
    const a=pos(id),b=pos(l.dest);
    const other=ROOMS[l.dest].links.find(o=>o.dest===id&&o.need!=='boss');
    const locked=!g.canPass(l)||(other&&!g.canPass(other));
    c.setLineDash(locked?[4,4]:[]);line(c,locked?'#a06c56':'#577879',2,a,b);c.setLineDash([]);
  }
  for(const id of known){
    const r=ROOMS[id],t=THEMES[r.theme],xy=pos(id);
    const [x,y]=xy,seen=g.state.visited.has(id),here=g.id===id;
    c.fillStyle=here?'#3a4540':seen?'#1d3335':'#172327';c.fillRect(x-49,y-20,98,40);
    c.strokeStyle=here?'#f2c78b':seen?t.rim+'a8':'#48646a';c.lineWidth=here?2:1;c.strokeRect(x-49,y-20,98,40);
    c.fillStyle=seen?'#f2ead2':'#a2b3b0';c.textAlign='center';c.textBaseline='middle';
    c.font='12px "Microsoft YaHei UI", sans-serif';c.fillText(seen?r.title:'未探索',x,y+4,93);
    c.fillStyle=t.light;c.fillRect(x-32,y-12,64,2);
    if(g.state.beacons.has(id))poly(c,'#9bddc9',[[x+42,y-17],[x+46,y-13],[x+42,y-9],[x+38,y-13]]);
  }
  text('map-status','已探索 '+g.state.visited.size+' / '+mapOrder.length+'　·　界印 '+g.state.seals.size+' / 3');
  const travel=el('travel');travel.replaceChildren();
  if(g.near?.kind==='beacon'){
    const destinations=[...g.state.beacons].filter(id=>id!==g.id);
    for(const id of destinations)travel.append(button(ROOMS[id].title,'',()=>g.travel(id)));
  }
}
function showControls(g,back){
  g.panelContext={back};g.setMode('controls');
}
const bindings=[
  ['移动',['A / D','← / →']],['跳跃',['Space / Z']],['攻击',['J / X']],['冲刺',['Shift / K']],
  ['交互',['E / ↑']],['修复',['Q / C']],['地图',['M / Tab']],['暂停',['Esc']],['切换武器',['1–4 / F']]
];
function drawPanel(g){
  const panel=el('panel-body');panel.replaceChildren();
  const eyebrow=node('p','eyebrow','RIFTBOUND'), title=node('h2'),content=node('div'),actions=node('div','panel-actions');
  panel.append(eyebrow,title,content,actions);
  const add=(label,fn,primary=false)=>actions.append(button(label,primary?'primary':'secondary',fn));
  const resume=()=>g.setMode('play'), home=()=>{g.save();g.setMode('title');};
  if(g.mode==='pause'){
    title.textContent='旅程暂停';
    add('继续探索',resume,true);add('操作与设置',()=>showControls(g,'pause'));add('保存并返回主菜单',home);
  }else if(g.mode==='dead'){
    title.textContent='信号中断';content.append(node('p','','苏醒地点 · '+ROOMS[g.state.checkpoint].title));
    add('在界标苏醒',()=>g.respawn(),true);add('返回主菜单',home);
  }else if(g.mode==='confirm'){
    title.textContent='开启新旅程';content.append(node('p','','新旅程会覆盖当前存档。'));
    add('覆盖存档并启程',()=>g.start(false),true);add('取消',()=>g.setMode('title'));
  }else if(g.mode==='win'){
    title.textContent='信号已接通';
    content.append(node('p','','第七夜终于过去。界门站收到了你归来的信号，三座界域重新亮起。'));
    const minutes=Math.floor(g.state.elapsed/60);
    content.append(node('p','','探索 '+g.state.visited.size+'/'+mapOrder.length+'　·　生命残片 '+g.state.shards.size+'/3　·　用时 '+minutes+':'+String(Math.floor(g.state.elapsed%60)).padStart(2,'0')));
    add('继续探索',resume,true);add('返回主菜单',home);
  }else{
    title.textContent='操作与设置';const keys=node('div','keys');
    for(const [label,list] of bindings){
      const row=node('div','',label), parts=node('span');
      for(const key of list)parts.append(node('kbd','',key));
      row.append(parts);keys.append(row);
    }
    content.append(keys);
    const saveSettings=()=>{writeStore(SETTINGS_KEY,g.settings);UI.refresh(g);};
    for(const [label,prop] of [['合成音效与音乐','audio'],['减弱镜头震动','motion']]){
      const row=node('label','setting',label), box=node('input');box.type='checkbox';box.checked=g.settings[prop];
      box.addEventListener('change',()=>{
        g.settings[prop]=box.checked;if(prop==='audio'){g.audio.unlock();g.audio.volume();}saveSettings();
      });
      row.append(box);content.append(row);
    }
    for(const [label,prop,choices] of [['触屏按钮','touch',[['auto','自动'],['on','开启'],['off','关闭']]],
      ['下一次遭遇的难度','difficulty',[['normal','标准'],['story','剧情']]]]){
      const row=node('label','setting',label),select=node('select');
      for(const [value,name] of choices){const op=node('option','',name);op.value=value;select.append(op);}
      select.value=g.settings[prop];select.addEventListener('change',()=>{g.settings[prop]=select.value;saveSettings();});
      row.append(select);content.append(row);
    }
    add('返回',()=>g.setMode(g.panelContext.back),true);
  }
  actions.firstElementChild?.focus({preventScroll:true});
}
const UI={
  mode(g){
    const mode=g.mode;stage.dataset.mode=mode;
    el('title').hidden=mode!=='title';el('hud').hidden=!['play','map'].includes(mode);
    el('map-screen').hidden=mode!=='map';
    const panel=['pause','dead','confirm','controls','win'].includes(mode);
    el('panel').hidden=!panel;
    if(mode==='title'){el('continue').hidden=!g.saveData;(g.saveData?el('continue'):el('begin')).focus({preventScroll:true});}
    if(mode==='map'){renderAtlas(g);el('close-map').focus({preventScroll:true});}
    if(panel)drawPanel(g);
    if(mode==='play'&&document.activeElement instanceof HTMLElement)document.activeElement.blur();
    this.refresh(g);this.hud(g);
  },
  refresh(g){
    const touch=g.settings.touch==='on'||(g.settings.touch==='auto'&&activeTouch());
    el('touch').hidden=!(touch&&g.mode==='play');stage.classList.toggle('touch',touch);
    const armory=el('weapon-belt').parentElement, host=touch?frame:el('hud');
    if(armory.parentElement!==host)host.append(armory);
    armory.classList.toggle('touch-armory',touch);armory.hidden=g.mode!=='play';
    text('title-audio',g.settings.audio?'声音开启':'声音关闭');
  },
  hud(g){
    if(g.mode!=='play' && g.mode!=='map')return;
    const p=g.player,r=g.room,hearts=el('health'),max=maxHealth(g);
    if(hearts.childElementCount!==max)hearts.replaceChildren(...Array.from({length:max},()=>node('i','heart')));
    [...hearts.children].forEach((h,i)=>h.classList.toggle('empty',i>=p.health));
    hearts.setAttribute('aria-label','生命 '+p.health+' / '+max);
    text('inventory','能量 '+p.energy+'/6　·　界印 '+g.state.seals.size+'/3');
    const weapon=WEAPONS[g.state.weapon],belt=el('weapon-belt');
    for(const slot of belt.children){
      const id=slot.dataset.weapon,owned=g.state.weapons.has(id);
      slot.disabled=!owned;slot.setAttribute('aria-pressed',String(id===g.state.weapon));
    }
    belt.parentElement.dataset.dry=String(p.dry>0&&g.state.weapon==='bow');
    text('weapon-label',weapon.name+(weapon.cost?(p.dry>0?' · 能量不足':' · −'+weapon.cost+' 能量'):''));
    const zone=THEMES[r.theme].label;
    text('zone',zone===r.title?r.title:zone+'　/　'+r.title);
    text('objective',g.state.defeated.has('mirror')?'探索余下的界域':g.id==='rift'||g.id==='core'?'追踪最后一段求救信号':objective(g.state));
    const enemy=g.enemies.find(e=>e.boss&&e.hp&&e.active);
    el('boss-hud').hidden=!enemy;
    if(enemy){
      text('boss-name',BOSSES[enemy.boss].name);el('boss-hp').style.width=100*enemy.hp/enemy.max+'%';
    }
    const item=g.near,prompt=el('prompt');prompt.hidden=!item||Boolean(enemy);
    if(item){
      let label;
      if(item.kind==='portal'||item.kind==='edge')label=g.canPass(item)?'前往'+ROOMS[item.dest].title:g.lockText(item);
      else label={beacon:'在界标休整',lore:'读取残留记录',ability:'获取'+ABILITIES[item.id]?.name,
        weapon:'拾取'+WEAPONS[item.id]?.name,shard:'拾取生命残片'}[item.kind];
      setContent(prompt.lastElementChild,label);setContent(prompt.firstElementChild,stage.classList.contains('touch')?'◇':'E');
    }
    el('caption').hidden=!g.caption;
    if(g.caption){text('caption-tag',g.caption.tag);text('caption-text',g.caption.text);}
    const banner=el('room-banner');banner.hidden=g.banner<=0||Boolean(enemy);
    if(!banner.hidden){
      setContent(banner.firstElementChild,zone===r.title?'':zone);
      setContent(banner.lastElementChild,r.title);
      banner.style.opacity=clamp(g.banner*2.8,0,1);
    }
  }
};
const keyboard={
  KeyA:'left',ArrowLeft:'left',KeyD:'right',ArrowRight:'right',
  Space:'jump',KeyZ:'jump',KeyW:'jump',KeyJ:'attack',KeyX:'attack',
  ShiftLeft:'dash',ShiftRight:'dash',KeyK:'dash',KeyE:'use',ArrowUp:'use',
  KeyQ:'heal',KeyC:'heal',KeyM:'map',Tab:'map',Escape:'pause',
  KeyF:'weapon',Digit1:'weapon0',Digit2:'weapon1',Digit3:'weapon2',Digit4:'weapon3'
};
function bind(g){
  const menuAction=(action)=>{
    if(action==='map'&&g.mode==='play'){g.setMode('map');return true;}
    if((action==='map'||action==='pause')&&g.mode==='map'){g.setMode('play');return true;}
    if(action==='pause'){
      if(g.mode==='play')g.setMode('pause');
      else if(g.mode==='pause')g.setMode('play');
      else if(g.mode==='controls')g.setMode(g.panelContext.back);
      else if(g.mode==='confirm')g.setMode('title');
      else return false;
      return true;
    }
    return false;
  };
  const held=new Map();
  addEventListener('keydown',e=>{
    const action=keyboard[e.code];if(!action||e.altKey||e.metaKey||e.ctrlKey)return;
    if(e.code==='Tab'&&g.mode!=='play')return;
    if(e.repeat){if(g.mode==='play')e.preventDefault();return;}
    g.audio.unlock();
    if(menuAction(action)){e.preventDefault();return;}
    if(g.mode!=='play')return;
    e.preventDefault();held.set(e.code,action);g.keys.add(action);g.pressed.add(action);
  });
  addEventListener('keyup',e=>{
    const action=held.get(e.code);if(!action)return;held.delete(e.code);
    if(![...held.values()].includes(action))g.keys.delete(action);
  });
  addEventListener('blur',()=>{g.keys.clear();g.pressed.clear();held.clear();});
  document.addEventListener('visibilitychange',()=>{if(document.hidden&&g.mode==='play')g.setMode('pause');});
  for(const b of el('touch').querySelectorAll('button')){
    const k=b.dataset.key;
    b.addEventListener('pointerdown',e=>{
      if(g.mode!=='play')return;e.preventDefault();g.audio.unlock();b.setPointerCapture(e.pointerId);
      g.keys.add(k);g.pressed.add(k);
    });
    const release=()=>g.keys.delete(k);
    b.addEventListener('pointerup',release);b.addEventListener('pointercancel',release);b.addEventListener('lostpointercapture',release);
    b.addEventListener('contextmenu',e=>e.preventDefault());
  }
  el('begin').onclick=()=>{g.audio.unlock();if(g.saveData)g.setMode('confirm');else g.start();};
  el('continue').onclick=()=>{g.audio.unlock();g.start(true);};
  el('title-controls').onclick=()=>showControls(g,'title');
  el('title-audio').onclick=()=>{g.settings.audio=!g.settings.audio;g.audio.unlock();g.audio.volume();writeStore(SETTINGS_KEY,g.settings);UI.refresh(g);};
  el('map-key').onclick=()=>menuAction('map');el('close-map').onclick=()=>menuAction('map');
  el('pause-key').onclick=()=>menuAction('pause');
  for(const [i,id] of weaponOrder.entries()){
    const w=WEAPONS[id],icon=canvas(88,66),slot=button('','weapon-slot',()=>{g.selectWeapon(id);UI.hud(g);});
    weaponArt(icon.getContext('2d'),id,35,36,-.52,id==='spear'?.51:.70);
    icon.setAttribute('aria-hidden','true');
    slot.dataset.weapon=id;slot.title=w.name+'　'+w.note+(w.room?'　'+w.room:'');
    slot.setAttribute('aria-label',w.name);slot.style.setProperty('--weapon-color',w.color);
    slot.append(icon,node('small','',String(i+1)));el('weapon-belt').append(slot);
  }
  addEventListener('resize',()=>{resize();UI.refresh(g);});
}
window.__ready=false;window.__fatal=null;window.__errors=[];window.__frames=0;
addEventListener('error',e=>window.__errors.push(String(e.message)));
function fail(error){
  window.__fatal=String(error?.stack||error);el('boot').hidden=false;el('boot-text').textContent='启动失败 · '+String(error?.message||error);
  console.error(error);
}
async function boot(){
  resize();
  if(!ctx)throw new Error('浏览器无法启动 Canvas 2D');
  const g=new Game(), manual=params.get('test')==='1';window.__G=g;
  const progress=async(msg,value)=>{
    text('boot-text',msg);el('boot-progress').style.width=value+'%';
    if(!manual)await new Promise(resolve=>setTimeout(resolve,12));
  };
  await progress('正在绘制界门站',30);artFor('hub');
  await progress('正在接通界标',100);bind(g);
  el('boot').hidden=true;g.setMode('title');
  if(params.has('autostart'))g.start(params.get('autostart')==='continue');
  const render=()=>{
    const title=g.mode==='title'||(g.mode==='controls'&&g.panelContext.back==='title')||g.mode==='confirm';
    renderScene(g,ctx,title);UI.hud(g);window.__frames++;
  };
  g.render=render;
  g.step=(frames=1)=>{
    for(let i=0;i<frames;i++)g.update(STEP);
    render();
  };
  g.ready=window.__ready=true;render();
  if(manual)return;
  let previous=performance.now(),lag=0;
  function frameLoop(now){
    lag=Math.min(.15,lag+Math.min(.09,Math.max(0,(now-previous)/1000)));previous=now;
    try{
      while(lag>=STEP){g.update(STEP);lag-=STEP;}
      const scene=g.mode==='title'||!g.room?'hub':g.room.theme;
      if(g.mode==='title'||g.mode==='play')g.audio.ambient(scene);
      render();requestAnimationFrame(frameLoop);
    }catch(e){fail(e);}
  }
  requestAnimationFrame(frameLoop);
}
boot().catch(fail);
